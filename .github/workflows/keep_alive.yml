name: Streamlit Keep Alive

on:
  schedule:
    # 這裡的設定代表每 6 小時自動執行一次 (時間採國際標準時 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # 保留這個按鈕，讓你可以隨時在網頁上手動點擊測試

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit App
        run: |
          # 第一個 App
          curl -s https://ards-vr-deadspace-calculator-cnef9rfpdr9579mnm9rccr.streamlit.app/ > /dev/null
          
          # 第二個 App (請直接把下方的範例網址刪除，改成你另一個 App 的真正網址)
          curl -s https://face-niv-app-994aaknhzmrfqouv5wqcma.streamlit.app/ > /dev/null

          # 第三個 App
          curl -s https://facenivcarenr-idnrutlbzfmgedmftx3w5k.streamlit.app/ > /dev/null
          
          echo "所有 App 均已保溫成功！"
